name: Build and Push Backend to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: waveapp-backend

jobs:
  build-and-push:
    name: Build and Push Backend
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # 1. Checkout source code
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # 2. Authenticate GitHub Actions to Azure using OIDC
      #    No client secret is required.
      # -------------------------------------------------------
      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # -------------------------------------------------------
      # 3. Authenticate Docker to Azure Container Registry
      # -------------------------------------------------------
      - name: Login to Azure Container Registry
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"

      # -------------------------------------------------------
      # 4. Enable Docker Buildx
      # -------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # -------------------------------------------------------
      # 5. Build production backend image and push to ACR
      #
      # Dockerfile:
      #   WaveApp.Api/Dockerfile
      #
      # Build context:
      #   repository root
      #
      # Two tags:
      #   immutable commit SHA
      #   latest
      # -------------------------------------------------------
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./WaveApp.Api/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------
      # 6. Display what was published
      # -------------------------------------------------------
      - name: Deployment information
        run: |
          echo "Backend image successfully pushed."
          echo "Registry: ${{ vars.ACR_LOGIN_SERVER }}"
          echo "Repository: ${{ env.IMAGE_NAME }}"
          echo "SHA tag: ${{ github.sha }}"